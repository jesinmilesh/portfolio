<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121226"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#bg)" stroke="url(#border)" stroke-width="4"/>
  <g filter="url(#glow)">
    
    <line x1="44" y1="32" x2="36" y2="96" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <line x1="92" y1="32" x2="84" y2="96" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <line x1="26" y1="52" x2="102" y2="52" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <line x1="22" y1="76" x2="98" y2="76" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
  
  </g>
</svg>