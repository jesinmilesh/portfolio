<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121226"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#bg)" stroke="url(#border)" stroke-width="4"/>
  <g filter="url(#glow)">
    
    <polygon points="64,28 32,46 96,46" fill="url(#accent)"/>
    <rect x="36" y="50" width="8" height="34" rx="2" fill="url(#accent)"/>
    <rect x="52" y="50" width="8" height="34" rx="2" fill="url(#accent)"/>
    <rect x="68" y="50" width="8" height="34" rx="2" fill="url(#accent)"/>
    <rect x="84" y="50" width="8" height="34" rx="2" fill="url(#accent)"/>
    <rect x="28" y="86" width="72" height="10" rx="2" fill="url(#accent)"/>
    <circle cx="64" cy="40" r="3" fill="#121226"/>
  
  </g>
</svg>