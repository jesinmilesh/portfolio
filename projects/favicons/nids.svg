    <path d="M64,24 L94,36 C94,66 78,88 64,98 C50,88 34,66 34,36 Z" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="48" cy="50" r="4" fill="url(#accent)"/>
    <circle cx="80" cy="50" r="4" fill="url(#accent)"/>
    <circle cx="64" cy="74" r="4" fill="url(#accent)"/>
    <line x1="48" y1="50" x2="80" y2="50" stroke="url(#accent)" stroke-width="3"/>
    <line x1="48" y1="50" x2="64" y2="74" stroke="url(#accent)" stroke-width="3"/>
    <line x1="80" y1="50" x2="64" y2="74" stroke="url(#accent)" stroke-width="3"/>
  
  </g>
</svg>